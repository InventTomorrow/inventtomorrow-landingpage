<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <link rel="icon" type="image/png" href="/images/logo-mark.png" />
    <link rel="apple-touch-icon" href="/images/logo-mark.png" />
    <link rel="preload" href="/fonts/dm-sans-latin-9fea608a947e.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin-6c18d579fd87.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('/fonts/dm-sans-latin-9fea608a947e.woff2') format('woff2'); }
      @font-face { font-family: 'Outfit'; font-style: normal; font-weight: 500 700; font-display: swap; src: url('/fonts/outfit-latin-6c18d579fd87.woff2') format('woff2'); }
      /* Development-only bootstrap. Production prerendering replaces this with the visible page. */
      html, body { margin: 0; background: #fff; }
      .boot-loader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.75rem; background: #fff; }
      .boot-loader__logo { position: relative; display: block; width: clamp(12rem, 60vw, 18rem); aspect-ratio: 613 / 158; overflow: hidden; }
      .boot-loader__logo img { position: absolute; left: 0; top: 0; height: 100%; width: auto; max-width: none; }
      .boot-loader__track { width: 5rem; height: 3px; overflow: hidden; border-radius: 2px; background: #e9eff6; }
      .boot-loader__track::after { content: ''; display: block; width: 100%; height: 100%; border-radius: inherit; background: #0181f5; transform-origin: left; animation: boot-progress 1.4s ease-in-out infinite alternate; }
      @keyframes boot-progress { from { transform: scaleX(.25); opacity: .5; } to { transform: scaleX(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-loader__track::after { animation: none; } }
    </style>
  </head>
  <body>
    <!--app-bootstrap-->
      <div id="app-bootstrap" class="boot-loader" role="status" aria-label="Loading Invent Tomorrow">
        <span class="boot-loader__logo"><img src="/images/logo.webp" alt="Invent Tomorrow" width="720" height="158" fetchpriority="high" /></span>
        <span class="boot-loader__track" aria-hidden="true"></span>
      </div>
    <!--/app-bootstrap-->
    <div id="root"><!--app-html--><!--/app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

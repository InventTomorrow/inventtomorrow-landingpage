<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <link rel="icon" type="image/png" href="/images/logo-mark.png" />
    <link rel="apple-touch-icon" href="/images/logo-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" />
    <style>
      /* First-paint loader. It is replaced when the app mounts, then the app's own loader takes over (src/components/AppLoader.tsx).
         Colours repeat --color-primary and --color-accent from src/index.css, which isn't loaded yet. */
      html, body { margin: 0; background: #010f34; }
      .boot-loader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; background: #010f34; color: #fff; font-family: Outfit, system-ui, sans-serif; }
      .boot-loader__ring { position: relative; width: 6rem; height: 6rem; }
      .boot-loader__ring::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.15); border-top-color: #2077bc; animation: boot-spin 1s linear infinite; }
      .boot-loader__mark { position: absolute; inset: 0.75rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #2077bc; font-size: 1.5rem; font-weight: 700; }
      .boot-loader__name { margin: 0; font-size: 1.25rem; font-weight: 600; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-loader__ring::before { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><!--app-html-->
      <div class="boot-loader" role="status" aria-label="Loading Invent Tomorrow">
        <div class="boot-loader__ring"><span class="boot-loader__mark">IT</span></div>
        <p class="boot-loader__name">Invent Tomorrow</p>
      </div>
    <!--/app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

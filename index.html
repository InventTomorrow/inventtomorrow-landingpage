<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <link rel="icon" type="image/png" href="/images/logo-mark.png" />
    <link rel="apple-touch-icon" href="/images/logo-mark.png" />
    <link rel="preload" href="/fonts/dm-sans-latin-9fea608a947e.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin-6c18d579fd87.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('/fonts/dm-sans-latin-9fea608a947e.woff2') format('woff2'); }
      @font-face { font-family: 'Outfit'; font-style: normal; font-weight: 500 700; font-display: swap; src: url('/fonts/outfit-latin-6c18d579fd87.woff2') format('woff2'); }
      /* Development-only bootstrap. Production prerendering replaces this with the visible page. */
      html, body { margin: 0; background: #010f34; }
      .boot-loader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; background: #010f34; color: #fff; font-family: Outfit, system-ui, sans-serif; }
      .boot-loader__ring { position: relative; width: 6rem; height: 6rem; }
      .boot-loader__ring::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.15); border-top-color: #2077bc; animation: boot-spin 1s linear infinite; }
      .boot-loader__mark { position: absolute; inset: 0.75rem; box-sizing: border-box; width: 4.5rem; height: 4.5rem; border-radius: 50%; padding: 0.5rem; background: #fff; object-fit: contain; }
      .boot-loader__name { margin: 0; font-size: 1.25rem; font-weight: 600; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-loader__ring::before { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><!--app-html-->
      <div class="boot-loader" role="status" aria-label="Loading Invent Tomorrow">
        <div class="boot-loader__ring"><img class="boot-loader__mark" src="/images/logo-mark.png" alt="" width="72" height="72" fetchpriority="high" /></div>
        <p class="boot-loader__name">Invent Tomorrow</p>
      </div>
    <!--/app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
